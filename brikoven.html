<!DOCTYPE html>
<html lang="en" ng-app="pizzaApp">

<head>
    <title>Pizza Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/2cea0294d2.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>
    <script src="./apps.js"></script>
    <style>
        /* Your existing CSS styles */
            /* Your existing CSS styles */
                /* Your existing CSS styles */     body {
                    background-color: #fec701;
            color: Black;
            margin: 0px;
            margin-top: -28px;
        }

        .heading {
            background-color: black;
            color: white;
            font-size: 40px;
            padding: 20px;
        }

        .topnav {
            overflow: hidden;
            background-color: rgb(41, 37, 37);
            margin-top: -28px;
            display: flex;
            align-items: center;
        }

        .topnav a {
            float: left;
            display: block;
            color: #f2f2f2;
            font-size: larger;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            transition: background-color 0.3s, color 0.3s;
        }

        .topnav a:hover {
            background-color: whitesmoke;
            color: black;
        }

        /* Sleek & Professional Search Box */
        .search-box {
            position: relative;
            width: 400px;
            /* Slightly smaller for a cleaner look */
            height: 40px;
            /* Reduced height */
            background-color: #f8f9fa;
            /* Light grey for a professional look */
            margin: 30px auto;
            /* Centers the box */
            border-radius: 25px;
            border: 1px solid #dfe1e5;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            transition: box-shadow 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        /* Input Field */
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            color: #202124;
            /* Darker text for readability */
            padding: 8px 12px;
            font-weight: 500;
        }

        /* Input Focus Effect */
        .search-box input:focus {
            color: #000;
            font-weight: bold;
        }

        /* Search Button */
        .search-box button {
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        /* Search Icon */
        .search-box button .fa-solid {
            font-size: 18px;
            color: #5f6368;
            /* Professional grey */
            transition: color 0.3s ease-in-out;
        }

        /* Hover & Focus Effects */
        .search-box:hover,
        .search-box:focus-within {
            border-color: #1a73e8;
            /* Google blue */
            box-shadow: 0 2px 6px rgba(26, 115, 232, 0.3);
        }

        /* Button Hover Effect */
        .search-box button:hover .fa-solid {
            color: #1a73e8;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .search-box {
                width: 90%;
                max-width: 320px;
            }

            .search-box input {
                font-size: 14px;
            }

            .search-box button .fa-solid {
                font-size: 16px;
            }
        }


        .item {
            display: flex;
            align-items: flex-start;
            background-color: antiquewhite;
            width: 800px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .item img {
            border-radius: 10px;
            margin-right: 20px;
            cursor: pointer;
        }

        .item-description {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-description b {
            display: block;
        }

        .item-description p.more-info {
            margin: 10px 0;
        }

        /* Cart Button - Warm & Elegant */
        .cart-button {
            background-color: #d49a6a;
            /* Soft brownish-orange */
            color: white;
            font-size: 16px;
            padding: 12px;
            width: 140px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease-in-out;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Hover Effect */
        .cart-button:hover {
            background-color: #b57f50;
            /* Slightly darker brown */
            transform: scale(1.05);
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.2);
        }

        /* Click Effect */
        .cart-button:active {
            transform: scale(0.97);
        }

        /* Subtle Cart Icon Animation */
        .cart-button i {
            transition: transform 0.3s ease-in-out;
        }

        .cart-button:hover i {
            transform: rotate(5deg);
        }

        #myImg {
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        #myImg:hover {
            opacity: 0.7;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
        }

        #caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            cursor: pointer;
        }

        @media only screen and (max-width: 700px) {
            .modal-content {
                width: 100%;
            }
        }




        /* Filter Container */
        .filter-container {
            display: flex;
            justify-content: flex-end;
            margin: 20px;
            padding: 10px;
        }

        /* Dropdown Wrapper */
        .filter-dropdown {
            position: relative;
            display: inline-block;
        }

        /* Filter Button */
        .filter-btn {
            background-color: #f4d7b5;
            /* Soft beige */
            color: #5a3e2b;
            /* Dark brown text */
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .filter-btn:hover {
            background-color: #eac9a8;
            /* Slightly deeper beige */
        }

        /* Dropdown Content */
        .filter-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fcf7f1;
            /* Soft off-white */
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.15);
            border-radius: 6px;
            padding: 10px 0;
            transition: opacity 0.3s ease, transform 0.2s ease;
            transform: translateY(5px);
            opacity: 0;
            visibility: hidden;
        }

        /* Dropdown Links */
        .filter-content a {
            color: #5a3e2b;
            /* Dark brown */
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .filter-content a:hover {
            background-color: #f4d7b5;
            /* Match button for a unified feel */
        }

        /* Show Dropdown on Hover */
        .filter-dropdown:hover .filter-content {
            display: block;
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

    </style>
</head>

<body ng-controller="MenuController">
    <header>
        <div class="header">
            <h1 style="background-color: black;color: white;padding: 20px;margin-top: 25px;">Pizza Menu</h1>
            <div class="topnav">
                <a href="explore.php">Home</a>
                <a href="Freshfare.php">Items</a>
                <a href="cart.html">Cart</a>
            </div>

            <div class="search-box">
                <input type="text" id="myInput" placeholder="Search here..." ng-model="searchQuery" ng-change="searchItems()">
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
    </header>

    <main style="margin-top: -80px;">
        <!-- Add the filter button and dropdown -->
        <div class="filter-container" style="margin-right: 420px;">
            <div class="filter-dropdown">
                <button class="filter-btn">Filter <i class="fa-solid fa-filter"></i></button>
                <div class="filter-content">
                    <a ng-click="applyFilter('priceLowToHigh')">Price: Low to High</a>
                    <a ng-click="applyFilter('priceHighToLow')">Price: High to Low</a>
                    <a ng-click="applyFilter('ratingHighToLow')">Rating: High to Low</a>
                    <a ng-click="applyFilter('dateNewest')">Date: Newest First</a>
                    <a ng-click="clearFilter()">Clear Filters</a>
                </div>
            </div>
        </div>

        <section style="margin-top: -80px;">
    <br><br>
    <div id="item-list">
        <div class="item" data-name="{{ item.name }}" ng-repeat="item in filteredMenu">
            <img 
                ng-src="{{ item.image }}" 
                height="180" 
                class="item-image" 
                ng-click="openModal(item.image, item.name)" 
                alt="{{ item.name }} image"
            >
            <div class="item-description">
                <h3 class="item-title">{{ item.name | uppercase }}</h3>
                <p class="item-price"><strong>₹{{ item.price.toFixed(2) }}</strong></p>
                <p class="more-info">{{ item.description | lowercase }}</p>
                <p class="date-info">Date Added: {{ item.dateAdded | date : 'dd-MMM-yyyy' }}</p>
                <div class="cart-button-container">
                    <button 
                        class="cart-button" 
                        ng-click="addToCart(item)" 
                        aria-label="Add {{ item.name }} to cart"
                    >
                        <i class="fa-solid fa-cart-plus"></i> Add to cart
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>

    </main>

    <!-- Modal -->
    <div id="myModal" class="modal" ng-show="modalVisible">
        <span class="close" ng-click="closeModal()">&times;</span>
        <img class="modal-content" ng-src="{{ modalImage }}">
        <div id="caption">{{ modalCaption }}</div>
    </div>
</body>

</html>
