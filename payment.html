<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Fresh Fare</title>
    <link rel="stylesheet" href="freshfare.css">
    <style>
        body {
            background-color: #fec701;
            color: black;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .header {
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 40px;
            margin: 0;
        }
        .form-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .payment-method {
            margin-top: 10px;
            font-size: 14px;
        }
        .payment-method label {
            margin-left: 5px;
            font-weight: normal;
        }
        .submit-button {
            padding: 10px 20px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        .submit-button:hover {
            background-color: #444;
        }
        .message {
            margin-top: 20px;
            font-size: 20px;
            color: green;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Payment Information</h1>
    </div>
    <div class="form-container">
        <form id="orderForm" onsubmit="return handleSubmit(event)">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="flat-building">Flat/Building No:</label>
                <input type="text" id="flat-building" required placeholder="e.g., 123, Flat 4B">
            </div>
            <div class="form-group">
                <label for="street">Street Address:</label>
                <input type="text" id="street" required placeholder="Enter street address">
            </div>
            <div class="form-group">
                <label for="city">City:</label>
                <input type="text" id="city" required placeholder="Enter city name">
            </div>
            <div class="form-group">
                <label for="pin-code">Pin Code:</label>
                <input type="text" id="pin-code" required placeholder="Enter pin code">
            </div>
            <div class="form-group">
                <label for="state">State:</label>
                <input type="text" id="state" required placeholder="Enter state">
            </div>
            <div class="form-group">
                <label for="country">Country:</label>
                <input type="text" id="country" required placeholder="Enter country">
            </div>
            <div class="form-group payment-method">
                <label>Payment Method:</label>
                <label for="cash">Cash on Delivery <input type="radio" name="payment" value="cash" id="cash" checked style="margin-left: -284px;margin-top: 18px;"></label>
            </div>
            <button type="submit" class="submit-button">Submit Order</button>
        </form>
        <div class="message" id="orderMessage" style="display: none;"></div>
    </div>
    <script>
        function handleSubmit(event) {
            event.preventDefault(); 
            document.getElementById('orderMessage').textContent = "Order Placed Successfully!";
            document.getElementById('orderMessage').style.display = "block";
            alert("Order Placed Successfully!"); 
            document.getElementById('orderForm').reset(); 
            return false; 
        }
    </script>
</body>
</html>
